name: Release check

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify the Marketplace asset
        run: python3 scripts/release.py "$GITHUB_REF_NAME"
